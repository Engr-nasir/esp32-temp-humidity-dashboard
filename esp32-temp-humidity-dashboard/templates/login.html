<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Temperature and Humidity Monitor</title>
<style>
  :root { --bg:#e9eff2; --ink:#0f2f36; --muted:#5b7077; --line:#cddbe0; --bad:#b3402f; --water:#1f6fa5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
         background:var(--bg); color:var(--ink); line-height:1.5; }
  main { max-width:380px; margin:0 auto; padding:12vh 24px 40px; }
  h1 { font-size:1.75rem; line-height:1.2; margin:0 0 8px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  label { display:block; font-weight:500; margin:14px 0 6px; }
  input { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:8px;
          background:#fff; color:var(--ink); font:inherit; }
  button { margin-top:22px; width:100%; padding:12px 16px; border:0; border-radius:8px;
           background:var(--ink); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  button:hover { background:#17454f; }
  :focus-visible { outline:3px solid var(--water); outline-offset:2px; }
  .error { color:var(--bad); min-height:1.5em; margin:12px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Temperature and humidity monitor</h1>
  <p class="sub">Sign in to see live readings from the sensor.</p>
  <form method="post">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <p class="error" role="alert">{{ error or "" }}</p>
  </form>
</main>
</body>
</html>
